<div class="panorama-viewer">
  <div
    #viewer
    class="panorama-viewer__canvas"
    role="region"
    [attr.aria-label]="title()"
    aria-describedby="panorama-instructions"
  ></div>
  <p id="panorama-instructions" class="sr-only">
    Arrastra para explorar. En pantalla táctil, usa dos dedos para no bloquear el desplazamiento de
    la página.
  </p>
</div>
